name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: avtofakt-node-server
          path: .output
          include-hidden-files: true
          retention-days: 7
      - run: pnpm build:vercel
      - run: node scripts/verify-vercel.mjs
